name: Release

# release-please keeps a "chore(main): release x.y.z" pull request open. It
# reads the commit messages on main since the last release (feat: → minor,
# fix: → patch, feat!: → major), bumps pubspec.yaml and writes CHANGELOG.md.
# Merging that PR tags the release, builds every platform with build.yml and
# publishes a GitHub Release with the files attached.
#
# Run workflow (Actions → Release) with the version left empty merges the
# release PR and releases it in one go. With a version, like 3.0.0 or
# 3.0.0-beta.1, it makes the release PR use that version instead.
# See devops.md 8, "Releases".
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Leave empty to release the open release PR now. Or type a version, like 3.0.0, for the release PR to use.
        type: string
        default: ''

permissions:
  contents: read

# One at a time, and never cancelled halfway through publishing.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # For the labels on the release PR.
      issues: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      # release-please reads a "Release-As:" line in a commit message as the
      # next version. The commit is empty and made through the API, so GitHub
      # signs it and nobody needs their own signing key.
      - name: Use the version asked for
        if: env.VERSION != ''
        run: |
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::$VERSION isn't a version like 3.0.0 or 3.0.0-beta.1."
            exit 1
          fi
          repo=repos/$GITHUB_REPOSITORY
          head=$(gh api "$repo/git/ref/heads/main" --jq .object.sha)
          tree=$(gh api "$repo/git/commits/$head" --jq .tree.sha)
          message=$(printf 'chore: release %s\n\nRelease-As: %s' "$VERSION" "$VERSION")
          commit=$(gh api "$repo/git/commits" -f message="$message" -f tree="$tree" -f "parents[]=$head" --jq .sha)
          gh api -X PATCH "$repo/git/refs/heads/main" -f sha="$commit" > /dev/null
      # A merge made with this workflow's token doesn't start another
      # workflow, so release-please runs right after it, in the next step.
      - name: Merge the release PR
        if: github.event_name == 'workflow_dispatch' && env.VERSION == ''
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --label 'autorelease: pending' --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            echo "::error::There's no release PR. release-please opens one once main has a feat: or fix: commit since the last release."
            exit 1
          fi
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash
      # The settings are in release-please-config.json, and the last version
      # released in .release-please-manifest.json.
      - id: release
        uses: googleapis/release-please-action@v5

  test:
    name: Analyze and test
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    name: Build
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    # What build.yml needs to sign the attestations.
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
      ref: ${{ needs.release-please.outputs.sha }}
      attest: true
    secrets: inherit

  # release-please made the release as a draft, so nobody sees it without its
  # files. If a build fails, re-run the failed jobs: the draft waits.
  publish:
    name: Publish
    needs: [release-please, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # A version with a hyphen, like 2.2.0-beta.1, is marked as a pre-release.
      - run: |
          prerelease=false
          case $VERSION in *-*) prerelease=true ;; esac
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Taskly $VERSION" \
            --prerelease="$prerelease" --draft=false
