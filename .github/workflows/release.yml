name: Release

# Pushing a tag like v2.1.0 builds Taskly for every platform and publishes a
# GitHub Release with the files attached. The tag must match the version in
# pubspec.yaml. Running the workflow by hand builds everything without
# publishing, to try the pipeline out. See devops.md 8, "Releases".
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  prepare:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          # version: 2.1.0+5 → 2.1.0. The +5 is the build number, which
          # Android and iOS use to tell uploads apart.
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in pubspec.yaml. Bump the version, commit, and tag that commit v$version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # android/app/build.gradle.kts signs with the key that key.properties
      # points to, and with the debug key when there's no such file.
      - name: Use the upload key
        if: env.KEYSTORE != ''
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=${KEY_PASSWORD:-$STORE_PASSWORD}
          EOF
      - name: No upload key
        if: env.KEYSTORE == ''
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 isn't set, so the Android builds are signed with the debug key. The Play Store won't take them."
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - run: |
          mkdir dist
          mv build/app/outputs/flutter-apk/app-release.apk "dist/taskly-$VERSION-android.apk"
          mv build/app/outputs/bundle/release/app-release.aab "dist/taskly-$VERSION-android.aab"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/
          if-no-files-found: error

  ios:
    name: iOS
    needs: prepare
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - id: signing
        name: Set up signing
        if: env.CERTIFICATE != ''
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: bash tool/ci/apple_signing.sh ios
      - name: Build (signed)
        if: steps.signing.outcome == 'success'
        env:
          TEAM: ${{ steps.signing.outputs.team }}
          PROFILE: ${{ steps.signing.outputs.profile }}
          IDENTITY: ${{ steps.signing.outputs.identity }}
          METHOD: ${{ steps.signing.outputs.method }}
        run: |
          options=$RUNNER_TEMP/ExportOptions.plist
          plutil -create xml1 "$options"
          plutil -insert method -string "$METHOD" "$options"
          plutil -insert teamID -string "$TEAM" "$options"
          plutil -insert signingStyle -string manual "$options"
          plutil -insert signingCertificate -string "$IDENTITY" "$options"
          plutil -insert provisioningProfiles -json \
            "$(jq -n --arg profile "$PROFILE" '{"com.jaival.taskly": $profile}')" "$options"
          # Otherwise exporting for the App Store asks App Store Connect for
          # the next build number, which needs an Apple ID.
          plutil -insert manageAppVersionAndBuildNumber -bool NO "$options"
          flutter build ipa --release --export-options-plist="$options"
          mkdir dist
          mv build/ios/ipa/*.ipa "dist/taskly-$VERSION-ios.ipa"
      # Without a certificate: an .ipa nobody has signed. Sideloading tools
      # like AltStore and Sideloadly sign it with the user's own Apple ID.
      - name: Build (unsigned)
        if: steps.signing.outcome == 'skipped'
        run: |
          echo "::warning::IOS_CERTIFICATE_P12_BASE64 isn't set, so the iOS app is unsigned."
          flutter build ios --release --no-codesign
          mkdir -p dist "$RUNNER_TEMP/ipa/Payload"
          cp -R build/ios/iphoneos/Runner.app "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qr - Payload) > "dist/taskly-$VERSION-ios-unsigned.ipa"
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: dist/
          if-no-files-found: error

  macos:
    name: macOS
    needs: prepare
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      NOTARY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - id: signing
        name: Set up signing
        if: env.CERTIFICATE != ''
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: bash tool/ci/apple_signing.sh macos
      - name: Build (signed)
        if: steps.signing.outcome == 'success'
        env:
          IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          # Firebase Auth keeps the session in the keychain, and on macOS that
          # needs Keychain Sharing. It's added only here because the
          # entitlement needs a team and a profile: a checked-in one would
          # stop the app from launching when built on a Mac without them.
          # Xcode fills in $(AppIdentifierPrefix), not the shell.
          # shellcheck disable=SC2016
          /usr/libexec/PlistBuddy \
            -c 'Add :keychain-access-groups array' \
            -c 'Add :keychain-access-groups:0 string $(AppIdentifierPrefix)com.jaival.taskly' \
            macos/Runner/Release.entitlements
          flutter build macos --release
          app=build/macos/Build/Products/Release/taskly.app

          # Notarization wants the hardened runtime and a secure timestamp on
          # everything in the app. Xcode signed it without them, so sign it
          # again, inside out, keeping the entitlements Xcode worked out.
          codesign -d --entitlements - --xml "$app" > "$RUNNER_TEMP/entitlements.plist"
          find "$app/Contents/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -print0 \
            | xargs -0 -I{} codesign --force --timestamp --options runtime --sign "$IDENTITY" {}
          codesign --force --timestamp --options runtime \
            --entitlements "$RUNNER_TEMP/entitlements.plist" --sign "$IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          # A disk image with the app and a shortcut to drag it onto.
          mkdir -p dist "$RUNNER_TEMP/dmg"
          ditto "$app" "$RUNNER_TEMP/dmg/taskly.app"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          dmg=dist/taskly-$VERSION-macos.dmg
          # hdiutil on the runners now and then fails with "Resource busy".
          for attempt in 1 2 3; do
            hdiutil create -volname Taskly -srcfolder "$RUNNER_TEMP/dmg" -ov -format UDZO "$dmg" && break
            [ $attempt = 3 ] && exit 1
            sleep 10
          done
          codesign --timestamp --sign "$IDENTITY" "$dmg"
      # Without notarization, macOS refuses to open the app until the user
      # allows it in System Settings → Privacy & Security.
      - name: Notarize
        if: steps.signing.outcome == 'success' && env.NOTARY_KEY != ''
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          key=$RUNNER_TEMP/AuthKey.p8
          echo "$NOTARY_KEY" | base64 --decode > "$key"
          dmg=dist/taskly-$VERSION-macos.dmg
          xcrun notarytool submit "$dmg" --key "$key" --key-id "$KEY_ID" --issuer "$ISSUER_ID" \
            --wait --output-format json > "$RUNNER_TEMP/notary.json" || true
          cat "$RUNNER_TEMP/notary.json"
          if [ "$(jq -r .status "$RUNNER_TEMP/notary.json")" != Accepted ]; then
            xcrun notarytool log "$(jq -r .id "$RUNNER_TEMP/notary.json")" \
              --key "$key" --key-id "$KEY_ID" --issuer "$ISSUER_ID"
            exit 1
          fi
          xcrun stapler staple "$dmg"
      - name: Not notarized
        if: steps.signing.outcome == 'success' && env.NOTARY_KEY == ''
        run: echo "::warning::APP_STORE_CONNECT_API_KEY_BASE64 isn't set, so the macOS app is signed but not notarized."
      - name: Build (unsigned)
        if: steps.signing.outcome == 'skipped'
        run: |
          echo "::warning::MACOS_CERTIFICATE_P12_BASE64 isn't set, so the macOS app is unsigned, and signing in won't work in it: Firebase Auth needs Keychain Sharing, which needs a signed app."
          flutter build macos --release
          mkdir dist
          ditto -c -k --keepParent build/macos/Build/Products/Release/taskly.app "dist/taskly-$VERSION-macos-unsigned.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/
          if-no-files-found: error

  windows:
    name: Windows
    needs: prepare
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build windows --release
      # The .exe needs the DLLs and the data folder next to it, so the whole
      # folder goes in the zip.
      - shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "dist\taskly-$env:VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/
          if-no-files-found: error

  web:
    name: Web
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # For serving from the root of a domain. The GitHub Pages deploy in
      # main.yml builds its own copy for /taskly-flutter/.
      - run: flutter build web --release
      - run: |
          mkdir dist
          (cd build/web && zip -qr - .) > "dist/taskly-$VERSION-web.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: dist/
          if-no-files-found: error

  release:
    name: Publish
    needs: [prepare, test, android, ios, macos, windows, web]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # A version with a hyphen, like 2.1.0-beta.1, is marked as a pre-release.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=
          case $VERSION in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Taskly $VERSION" \
            --generate-notes $prerelease
