name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: flutter analyze
      - run: flutter test

  rules:
    name: Firestore rules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rules_test
    steps:
      - uses: actions/checkout@v7
      # The Firestore emulator is a Java program; firebase-tools needs Java 21+.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rules_test/package-lock.json
      # The emulator itself is downloaded on first use; keep it between runs.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('rules_test/package-lock.json') }}
      - run: npm ci
      - run: npm test

  web:
    name: Service worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # web/sw.js against an imitation of a browser; nothing to install.
      - run: node --test "web_test/*.test.mjs"

  wasm:
    name: WebAssembly build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # The deployed app is still the JavaScript build. This keeps the code
      # compiling to WebAssembly too, so switching later is a deploy change.
      - run: flutter build web --wasm --release

  integration:
    name: Integration test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # The emulators need Java 21+ and firebase-tools, which rules_test has.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rules_test/package-lock.json
      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('rules_test/package-lock.json') }}
      - run: npm ci
        working-directory: rules_test
      - run: flutter pub get
      # The whole app in headless Chrome against the Auth and Firestore
      # emulators, with the real rules. The runner comes with Chrome and a
      # matching chromedriver. No Firebase login is needed for emulators.
      - run: |
          "$CHROMEWEBDRIVER/chromedriver" --port=4444 &
          rules_test/node_modules/.bin/firebase emulators:exec \
            --only auth,firestore --project taskly-9ef7d \
            "flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart -d web-server --browser-name=chrome --headless --dart-define=USE_FIREBASE_EMULATORS=true"

  deploy:
    name: Deploy to GitHub Pages
    needs: [check, rules, web, wasm, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build web --release --base-href /${{ github.event.repository.name }}/
      # GitHub Pages has no SPA rewrites; serving the app as the 404 page lets
      # deep links like /taskly-flutter/projects load after a refresh.
      - run: cp build/web/index.html build/web/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web
      - id: deployment
        uses: actions/deploy-pages@v5
